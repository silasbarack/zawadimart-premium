    <meta name="description" content="ZawadiMart premium Kenyan online shopping experience." />
    <style>
      /* Startup loader: shown by the browser straight away, before any JavaScript arrives. */
      #boot{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;background:#fff;font-family:system-ui,-apple-system,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;color:#242424;transition:opacity .35s ease,visibility .35s}
      #boot.done{opacity:0;visibility:hidden}
      #boot .boot-box{display:grid;justify-items:center;gap:14px;padding:24px;text-align:center}
      #boot .boot-ring{position:relative;width:112px;height:112px}
      #boot .boot-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
      #boot .boot-track{fill:none;stroke:#f6dcdc;stroke-width:6}
      #boot .boot-arc{fill:none;stroke:#cf0f12;stroke-width:6;stroke-linecap:round;transition:stroke-dashoffset .25s linear}
      #boot .boot-spin{fill:none;stroke:#ef7904;stroke-width:6;stroke-linecap:round;transform-origin:50% 50%;animation:boot-spin 1.1s linear infinite}
      #boot img{position:absolute;inset:22px;width:68px;height:68px}
      #boot .boot-text{margin:0;font-size:15px;font-weight:700;color:#444;min-height:22px}
      #boot .boot-note{margin:0;max-width:280px;font-size:13.5px;line-height:1.5;color:#777;min-height:20px}
      @keyframes boot-spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){#boot .boot-spin{animation-duration:3s}#boot .boot-arc{transition:none}}
    </style>

    <script>
      // Fills the circle as the site really loads: the HTML (now), the app code
      // (main.jsx), then live prices from the API (catalog.jsx). Between those steps
      // it creeps forward slowly, so a slow connection shows as a slowly filling ring.
      (function () {
        var boot = document.getElementById('boot');
        var arc = boot.querySelector('.boot-arc');
        var text = boot.querySelector('.boot-text');
        var note = boot.querySelector('.boot-note');
        var LENGTH = 314.16, start = Date.now(), target = 0.1, shown = 0.1, stepAt = start, finished = false;
        function draw() {
          if (finished) return;
          // Creep up to 22% past the last real step while waiting for the next one,
          // and never move backwards.
          var creep = 0.22 * (1 - Math.exp(-(Date.now() - stepAt) / 3000));
          var goal = Math.min(0.96, target + creep);
          shown = Math.max(shown, shown + (goal - shown) * 0.3);
          arc.style.strokeDashoffset = String(LENGTH * (1 - shown));
          var waited = Date.now() - start;
          if (!navigator.onLine) note.textContent = "You're offline. We'll carry on as soon as you're connected.";
          else if (waited > 6000) note.textContent = 'Your connection seems slow. Still loading…';
          else note.textContent = '';
          setTimeout(draw, 120);
        }
        window.__zmBoot = {
          progress: function (value, label) {
            if (value > target) { target = value; stepAt = Date.now(); }
            if (label) text.textContent = label;
          },
          done: function () {
            if (finished) return;
            finished = true;
            arc.style.strokeDashoffset = '0';
            text.textContent = 'Ready';
            setTimeout(function () {
              boot.classList.add('done');
              setTimeout(function () { boot.remove(); }, 400);
            }, 180);
          },
          isDone: function () { return finished; },
        };
        draw();
      })();
    </script>
